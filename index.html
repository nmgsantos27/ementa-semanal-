<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ementa Semanal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyBNOeSZW9DTJ6Q9DrEzcO9IP-Ycu7jZJl0",
      authDomain: "ementa-semanal-17105.firebaseapp.com",
      projectId: "ementa-semanal-17105",
      storageBucket: "ementa-semanal-17105.firebasestorage.app",
      messagingSenderId: "918577134480",
      appId: "1:918577134480:web:aa70047d13284f25441115"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const sugestoesRefeicoes = [
      "Bacalhau à Brás", "Frango Assado", "Massada de Peixe", 
      "Arroz de Pato", "Carne de Porco à Alentejana", "Bife de Peru Grelhado",
      "Caldo Verde", "Salmão Grelhado", "Lasanha de Legumes", "Strogonoff de Frango"
    ];

    function App() {
      const [tab, setTab] = React.useState('ementa');
      const [ementa, setEmenta] = React.useState({
        Segunda: { almoco: '', jantar: '' },
        Terca: { almoco: '', jantar: '' },
        Quarta: { almoco: '', jantar: '' },
        Quinta: { almoco: '', jantar: '' },
        Sexta: { almoco: '', jantar: '' },
        Sabado: { almoco: '', jantar: '' },
        Domingo: { almoco: '', jantar: '' }
      });
      const [listaCompras, setListaCompras] = React.useState([]);
      const [novoItem, setNovoItem] = React.useState('');

      React.useEffect(() => {
        try {
          const unsubscribe = db.collection('ementas').doc('semanal')
            .onSnapshot((doc) => {
              if (doc.exists) setEmenta(doc.data());
            }, (error) => console.log(error));
          return () => unsubscribe();
        } catch (e) { console.error(e); }
      }, []);

      React.useEffect(() => {
        try {
          const unsubscribe = db.collection('compras').doc('lista')
            .onSnapshot((doc) => {
              if (doc.exists) setListaCompras(doc.data().itens || []);
            }, (error) => console.log(error));
          return () => unsubscribe();
        } catch (e) { console.error(e); }
      }, []);

      const atualizarEmenta = (dia, refeicao, valor) => {
        const novaEmenta = { ...ementa, [dia]: { ...ementa[dia], [refeicao]: valor } };
        setEmenta(novaEmenta);
        db.collection('ementas').doc('semanal').set(novaEmenta);
      };

      const sugerirRefeicao = (dia, refeicao) => {
        const sugestao = sugestoesRefeicoes[Math.floor(Math.random() * sugestoesRefeicoes.length)];
        atualizarEmenta(dia, refeicao, sugestao);
      };

      const adicionarItemCompra = (e) => {
        e.preventDefault();
        if (!novoItem.trim()) return;
        const novaLista = [...listaCompras, { id: Date.now(), texto: novoItem, comprado: false }];
        setListaCompras(novaLista);
        db.collection('compras').doc('lista').set({ itens: novaLista });
        setNovoItem('');
      };

      const toggleItemCompra = (id) => {
        const novaLista = listaCompras.map(item => item.id === id ? { ...item, comprado: !item.comprado } : item);
        setListaCompras(novaLista);
        db.collection('compras').doc('lista').set({ itens: novaLista });
      };

      const removerItemCompra = (id) => {
        const novaLista = listaCompras.filter(item => item.id !== id);
        setListaCompras(novaLista);
        db.collection('compras').doc('lista').set({ itens: novaLista });
      };

      const dias = [
        { chave: 'Segunda', nome: 'Segunda-feira' },
        { chave: 'Terca', nome: 'Terça-feira' },
        { chave: 'Quarta', nome: 'Quarta-feira' },
        { chave: 'Quinta', nome: 'Quinta-feira' },
        { chave: 'Sexta', nome: 'Sexta-feira' },
        { chave: 'Sabado', nome: 'Sábado' },
        { chave: 'Domingo', nome: 'Domingo' }
      ];

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-20">
          <header className="bg-emerald-600 text-white p-5 rounded-b-3xl shadow-md sticky top-0 z-10">
            <h1 className="text-xl font-bold">Ementa Semanal 🥗</h1>
            <p className="text-xs text-emerald-100">Partilhada em Tempo Real</p>
          </header>

          <main className="p-4 flex-1">
            {tab === 'ementa' && (
              <div className="space-y-4">
                {dias.map(({ chave, nome }) => (
                  <div key={chave} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <span className="font-bold text-slate-800 text-sm block mb-3">{nome}</span>
                    <div className="space-y-3">
                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-[10px] font-semibold text-slate-400 uppercase">Almoço</label>
                          <button onClick={() => sugerirRefeicao(chave, 'almoco')} className="text-[11px] text-emerald-600 font-medium">✨ Sugerir</button>
                        </div>
                        <input
                          type="text"
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800"
                          value={ementa[chave]?.almoco || ''}
                          onChange={(e) => atualizarEmenta(chave, 'almoco', e.target.value)}
                          placeholder="O que almoçar?"
                        />
                      </div>
                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-[10px] font-semibold text-slate-400 uppercase">Jantar</label>
                          <button onClick={() => sugerirRefeicao(chave, 'jantar')} className="text-[11px] text-emerald-600 font-medium">✨ Sugerir</button>
                        </div>
                        <input
                          type="text"
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800"
                          value={ementa[chave]?.jantar || ''}
                          onChange={(e) => atualizarEmenta(chave, 'jantar', e.target.value)}
                          placeholder="O que jantar?"
                        />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {tab === 'compras' && (
              <div className="space-y-4">
                <form onSubmit={adicionarItemCompra} className="flex gap-2">
                  <input
                    type="text"
                    value={novoItem}
                    onChange={(e) => setNovoItem(e.target.value)}
                    placeholder="Adicionar à lista..."
                    className="flex-1 p-3 bg-white border border-slate-200 rounded-xl text-sm"
                  />
                  <button type="submit" className="bg-emerald-600 text-white font-bold px-4 rounded-xl text-lg">+</button>
                </form>

                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                  <h3 className="font-bold text-slate-800 text-sm mb-3">Lista de Compras</h3>
                  {listaCompras.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-6">Lista vazia!</p>
                  ) : (
                    <ul className="space-y-2">
                      {listaCompras.map((item) => (
                        <li key={item.id} className="flex items-center justify-between p-2 border-b border-slate-50">
                          <label className="flex items-center gap-3 flex-1 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={item.comprado}
                              onChange={() => toggleItemCompra(item.id)}
                              className="w-4 h-4 accent-emerald-600 rounded"
                            />
                            <span className={`text-sm ${item.comprado ? 'line-through text-slate-400' : 'text-slate-700'}`}>{item.texto}</span>
                          </label>
                          <button onClick={() => removerItemCompra(item.id)} className="text-xs text-rose-500 font-bold px-2">✕</button>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-2 max-w-md mx-auto flex justify-around z-20">
            <button onClick={() => setTab('ementa')} className={`py-1.5 px-6 rounded-xl text-xs font-semibold ${tab === 'ementa' ? 'text-emerald-600 bg-emerald-50' : 'text-slate-400'}`}>📅 Ementa</button>
            <button onClick={() => setTab('compras')} className={`py-1.5 px-6 rounded-xl text-xs font-semibold ${tab === 'compras' ? 'text-emerald-600 bg-emerald-50' : 'text-slate-400'}`}>🛒 Compras</button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
