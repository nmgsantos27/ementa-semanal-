<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ementa Semanal Partilhada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React e ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para interpretar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    // 1. AS TUAS CREDENCIAIS DO FIREBASE
    const firebaseConfig = {
      apiKey: "A_TUA_API_KEY",
      authDomain: "O_TEU_PROJECT_ID.firebaseapp.com",
      projectId: "O_TEU_PROJECT_ID",
      storageBucket: "O_TEU_PROJECT_ID.appspot.com",
      messagingSenderId: "O_TEU_SENDER_ID",
      appId: "O_TEU_APP_ID"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // COMPONENTE PRINCIPAL
    function App() {
      const [ementa, setEmenta] = React.useState({
        Segunda: { almoco: '', jantar: '' },
        Terca: { almoco: '', jantar: '' },
        Quarta: { almoco: '', jantar: '' },
        Quinta: { almoco: '', jantar: '' },
        Sexta: { almoco: '', jantar: '' },
        Sabado: { almoco: '', jantar: '' },
        Domingo: { almoco: '', jantar: '' }
      });

      // Ler dados em tempo real do Firestore
      React.useEffect(() => {
        const unsubscribe = db.collection('ementas').doc('semanal')
          .onSnapshot((doc) => {
            if (doc.exists) {
              setEmenta(doc.data());
            }
          });
        return () => unsubscribe();
      }, []);

      // Atualizar no Firestore ao alterar
      const handleChange = (dia, refeicao, valor) => {
        const novaEmenta = {
          ...ementa,
          [dia]: { ...ementa[dia], [refeicao]: valor }
        };
        setEmenta(novaEmenta);
        db.collection('ementas').doc('semanal').set(novaEmenta);
      };

      const dias = [
        { chave: 'Segunda', nome: 'Segunda-feira' },
        { chave: 'Terca', nome: 'Terça-feira' },
        { chave: 'Quarta', nome: 'Quarta-feira' },
        { chave: 'Quinta', nome: 'Quinta-feira' },
        { chave: 'Sexta', nome: 'Sexta-feira' },
        { chave: 'Sabado', nome: 'Sábado' },
        { chave: 'Domingo', nome: 'Domingo' }
      ];

      return (
        <div class="max-w-md mx-auto p-4 pb-20">
          <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-slate-800">🥗 Ementa Semanal</h1>
            <p class="text-xs text-slate-500">Sincronizada em tempo real</p>
          </header>

          <div class="space-y-4">
            {dias.map(({ chave, nome }) => (
              <div key={chave} class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-semibold text-slate-700 mb-2">{nome}</h2>
                <div class="space-y-2 text-sm">
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Almoço</label>
                    <input
                      type="text"
                      class="w-full p-2 border rounded-lg bg-slate-50 focus:bg-white text-slate-800"
                      value={ementa[chave]?.almoco || ''}
                      onChange={(e) => handleChange(chave, 'almoco', e.target.value)}
                      placeholder="O que vamos almoçar?"
                    />
                  </div>
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Jantar</label>
                    <input
                      type="text"
                      class="w-full p-2 border rounded-lg bg-slate-50 focus:bg-white text-slate-800"
                      value={ementa[chave]?.jantar || ''}
                      onChange={(e) => handleChange(chave, 'jantar', e.target.value)}
                      placeholder="O que vamos jantar?"
                    />
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
