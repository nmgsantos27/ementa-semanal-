<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ementa Semanal & Compras</title>
  
  <!-- Configurações PWA e Instalação -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ementa">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3405/3405771.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body className="bg-slate-50 min-h-screen">
  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker Registado!'))
          .catch(err => console.log('Erro ao registar Service Worker:', err));
      });
    }
  </script>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyBNOeSZW9DTJ6Q9DrEzcO9IP-Ycu7jZJl0",
      authDomain: "ementa-semanal-17105.firebaseapp.com",
      projectId: "ementa-semanal-17105",
      storageBucket: "ementa-semanal-17105.firebasestorage.app",
      messagingSenderId: "918577134480",
      appId: "1:918577134480:web:aa70047d13284f25441115"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const pratosIniciais = [
      "Arroz de Pato", "Bacalhau à Brás", "Bife de Peru Grelhado", 
      "Caldo Verde / Sopa", "Carne de Porco à Alentejana", "Frango Assado com Batatas", 
      "Hambúrguer Caseiro", "Lasanha de Legumes", "Massada de Peixe", 
      "Omelete de Espinafres", "Polvo à Lagareiro", "Salmão Grelhado com Arroz", "Strogonoff de Frango"
    ];

    const produtosPreDefinidos = [
      "Arroz", "Azeite", "Carne de Frango", "Carne de Vaca/Porco", 
      "Fruta", "Legumes para Sopa", "Leite", "Massa", 
      "Ovos", "Papel Higiénico", "Peixe Fresco", "Pão"
    ];

    function App() {
      const [tab, setTab] = React.useState('ementa');
      
      const [ementa, setEmenta] = React.useState({
        Segunda: { almoco: '', jantar: '' },
        Terca: { almoco: '', jantar: '' },
        Quarta: { almoco: '', jantar: '' },
        Quinta: { almoco: '', jantar: '' },
        Sexta: { almoco: '', jantar: '' },
        Sabado: { almoco: '', jantar: '' },
        Domingo: { almoco: '', jantar: '' }
      });

      const [listaPratos, setListaPratos] = React.useState(pratosIniciais);
      const [novoPratoInput, setNovoPratoInput] = React.useState('');
      const [pesquisaPrato, setPesquisaPrato] = React.useState('');
      
      const [modalAberto, setModalAberto] = React.useState(false);
      const [diaSelecionado, setDiaSelecionado] = React.useState(null);
      const [refeicaoSelecionada, setRefeicaoSelecionada] = React.useState(null);

      const [catalogo, setCatalogo] = React.useState(produtosPreDefinidos);
      const [novoProdutoCatalogo, setNovoProdutoCatalogo] = React.useState('');
      const [listaCompras, setListaCompras] = React.useState([]);

      // Sincronizar Ementa
      React.useEffect(() => {
        const unsub = db.collection('ementas').doc('semanal').onSnapshot((doc) => {
          if (doc.exists) setEmenta(doc.data());
        });
        return () => unsub();
      }, []);

      // Sincronizar Pratos
      React.useEffect(() => {
        const unsub = db.collection('ementas').doc('catalogoPratos').onSnapshot((doc) => {
          if (doc.exists) setListaPratos(doc.data().itens || pratosIniciais);
        });
        return () => unsub();
      }, []);

      // Sincronizar Produtos
      React.useEffect(() => {
        const unsub = db.collection('compras').doc('catalogo').onSnapshot((doc) => {
          if (doc.exists) setCatalogo(doc.data().itens || produtosPreDefinidos);
        });
        return () => unsub();
      }, []);

      // Sincronizar Compras Ativas
      React.useEffect(() => {
        const unsub = db.collection('compras').doc('ativa').onSnapshot((doc) => {
          if (doc.exists) setListaCompras(doc.data().itens || []);
        });
        return () => unsub();
      }, []);

      const atualizarEmenta = (dia, refeicao, valor) => {
        const novaEmenta = { ...ementa, [dia]: { ...ementa[dia], [refeicao]: valor } };
        setEmenta(novaEmenta);
        db.collection('ementas').doc('semanal').set(novaEmenta);
      };

      const abrirSeletorPrato = (dia, refeicao) => {
        setDiaSelecionado(dia);
        setRefeicaoSelecionada(refeicao);
        setModalAberto(true);
      };

      const selecionarPratoDoModal = (nomePrato) => {
        if (diaSelecionado && refeicaoSelecionada) {
          atualizarEmenta(diaSelecionado, refeicaoSelecionada, nomePrato);
        }
        setModalAberto(false);
      };

      const adicionarNovoPratoGeral = (e) => {
        e.preventDefault();
        if (!novoPratoInput.trim()) return;
        if (listaPratos.some(p => p.toLowerCase() === novoPratoInput.trim().toLowerCase())) return;
        
        const novaLista = [...listaPratos, novoPratoInput.trim()].sort((a, b) => a.localeCompare(b, 'pt'));
        setListaPratos(novaLista);
        db.collection('ementas').doc('catalogoPratos').set({ itens: novaLista });
        setNovoPratoInput('');
      };

      const removerPratoGeral = (pratoNome) => {
        const novaLista = listaPratos.filter(p => p !== pratoNome);
        setListaPratos(novaLista);
        db.collection('ementas').doc('catalogoPratos').set({ itens: novaLista });
      };

      const sugerirRefeicao = (dia, refeicao) => {
        const sugestao = listaPratos[Math.floor(Math.random() * listaPratos.length)];
        atualizarEmenta(dia, refeicao, sugestao);
      };

      const limparEmentaSemanal = () => {
        if (confirm("Tens a certeza que queres limpar toda a ementa da semana?")) {
          const ementaVazia = {
            Segunda: { almoco: '', jantar: '' },
            Terca: { almoco: '', jantar: '' },
            Quarta: { almoco: '', jantar: '' },
            Quinta: { almoco: '', jantar: '' },
            Sexta: { almoco: '', jantar: '' },
            Sabado: { almoco: '', jantar: '' },
            Domingo: { almoco: '', jantar: '' }
          };
          setEmenta(ementaVazia);
          db.collection('ementas').doc('semanal').set(ementaVazia);
        }
      };

      const adicionarAoCatalogo = (e) => {
        e.preventDefault();
        if (!novoProdutoCatalogo.trim()) return;
        if (catalogo.some(c => c.toLowerCase() === novoProdutoCatalogo.trim().toLowerCase())) return;

        const novoCat = [...catalogo, novoProdutoCatalogo.trim()].sort((a, b) => a.localeCompare(b, 'pt'));
        setCatalogo(novoCat);
        db.collection('compras').doc('catalogo').set({ itens: novoCat });
        setNovoProdutoCatalogo('');
      };

      const enviarParaCompras = (produtoNome) => {
        if (listaCompras.some(i => i.texto === produtoNome)) return;
        const novaLista = [...listaCompras, { id: Date.now() + Math.random(), texto: produtoNome, comprado: false }];
        setListaCompras(novaLista);
        db.collection('compras').doc('ativa').set({ itens: novaLista });
      };

      const toggleItemCompra = (id) => {
        const novaLista = listaCompras.map(item => item.id === id ? { ...item, comprado: !item.comprado } : item);
        setListaCompras(novaLista);
        db.collection('compras').doc('ativa').set({ itens: novaLista });
      };

      const removerItemCompra = (id) => {
        const novaLista = listaCompras.filter(item => item.id !== id);
        setListaCompras(novaLista);
        db.collection('compras').doc('ativa').set({ itens: novaLista });
      };

      const limparListaSupermercado = () => {
        if (confirm("Tens a certeza que queres limpar toda a lista do supermercado?")) {
          setListaCompras([]);
          db.collection('compras').doc('ativa').set({ itens: [] });
        }
      };

      const limparComprados = () => {
        const novaLista = listaCompras.filter(item => !item.comprado);
        setListaCompras(novaLista);
        db.collection('compras').doc('ativa').set({ itens: novaLista });
      };

      const dias = [
        { chave: 'Segunda', nome: 'Segunda-feira' },
        { chave: 'Terca', nome: 'Terça-feira' },
        { chave: 'Quarta', nome: 'Quarta-feira' },
        { chave: 'Quinta', nome: 'Quinta-feira' },
        { chave: 'Sexta', nome: 'Sexta-feira' },
        { chave: 'Sabado', nome: 'Sábado' },
        { chave: 'Domingo', nome: 'Domingo' }
      ];

      // Ordenar pratos, produtos e compras de A a Z com suporte a acentos portugueses
      const pratosOrdenados = [...listaPratos].sort((a, b) => a.localeCompare(b, 'pt'));
      const catalogoOrdenado = [...catalogo].sort((a, b) => a.localeCompare(b, 'pt'));
      
      const comprasOrdenadas = [...listaCompras].sort((a, b) => {
        if (a.comprado !== b.comprado) return a.comprado ? 1 : -1;
        return a.texto.localeCompare(b.texto, 'pt');
      });

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-24 relative">
          <header className="bg-emerald-600 text-white p-5 rounded-b-3xl shadow-md sticky top-0 z-10 pt-8">
            <div className="flex justify-between items-center">
              <div>
                <h1 className="text-xl font-bold">Ementa & Compras 🥗</h1>
                <p className="text-xs text-emerald-100">Sincronizado a dois</p>
              </div>
              {tab === 'ementa' && (
                <button 
                  onClick={limparEmentaSemanal}
                  className="text-[10px] bg-emerald-700 hover:bg-emerald-800 text-white font-medium px-2.5 py-1.5 rounded-lg transition"
                >
                  Limpar Ementa
                </button>
              )}
            </div>
          </header>

          <main className="p-4 flex-1">
            {/* ABA EMENTA */}
            {tab === 'ementa' && (
              <div className="space-y-4">
                <p className="text-xs text-slate-400 text-center">Clica em "📖 Escolher" para pesquisar pratos guardados.</p>
                {dias.map(({ chave, nome }) => (
                  <div key={chave} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                    <span className="font-bold text-slate-800 text-sm block mb-3">{nome}</span>
                    <div className="space-y-3">
                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-[10px] font-semibold text-slate-400 uppercase">Almoço</label>
                          <div className="flex gap-2">
                            <button onClick={() => abrirSeletorPrato(chave, 'almoco')} className="text-[11px] text-emerald-600 font-semibold">📖 Escolher</button>
                            <button onClick={() => sugerirRefeicao(chave, 'almoco')} className="text-[11px] text-emerald-600 font-medium">✨ Sugerir</button>
                          </div>
                        </div>
                        <input
                          type="text"
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800"
                          value={ementa[chave]?.almoco || ''}
                          onChange={(e) => atualizarEmenta(chave, 'almoco', e.target.value)}
                          placeholder="O que almoçar?"
                        />
                      </div>
                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="text-[10px] font-semibold text-slate-400 uppercase">Jantar</label>
                          <div className="flex gap-2">
                            <button onClick={() => abrirSeletorPrato(chave, 'jantar')} className="text-[11px] text-emerald-600 font-semibold">📖 Escolher</button>
                            <button onClick={() => sugerirRefeicao(chave, 'jantar')} className="text-[11px] text-emerald-600 font-medium">✨ Sugerir</button>
                          </div>
                        </div>
                        <input
                          type="text"
                          className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800"
                          value={ementa[chave]?.jantar || ''}
                          onChange={(e) => atualizarEmenta(chave, 'jantar', e.target.value)}
                          placeholder="O que jantar?"
                        />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* ABA PRATOS */}
            {tab === 'pratos' && (
              <div className="space-y-4">
                <form onSubmit={adicionarNovoPratoGeral} className="flex gap-2">
                  <input
                    type="text"
                    value={novoPratoInput}
                    onChange={(e) => setNovoPratoInput(e.target.value)}
                    placeholder="Adicionar novo prato habitual..."
                    className="flex-1 p-3 bg-white border border-slate-200 rounded-xl text-sm shadow-sm"
                  />
                  <button type="submit" className="bg-emerald-600 text-white font-bold px-4 rounded-xl text-lg shadow-md">+</button>
                </form>

                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                  <h3 className="font-bold text-slate-800 text-sm mb-3">Lista de Pratos (A–Z)</h3>
                  <ul className="space-y-2">
                    {pratosOrdenados.map((prato, index) => (
                      <li key={index} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
                        <span className="text-sm font-medium text-slate-800">{prato}</span>
                        <button onClick={() => removerPratoGeral(prato)} className="text-xs text-rose-500 font-bold px-2 py-1">✕</button>
                      </li>
                    ))}
                  </ul>
                </div>
              </div>
            )}

            {/* ABA PRODUTOS */}
            {tab === 'catalogo' && (
              <div className="space-y-4">
                <form onSubmit={adicionarAoCatalogo} className="flex gap-2">
                  <input
                    type="text"
                    value={novoProdutoCatalogo}
                    onChange={(e) => setNovoProdutoCatalogo(e.target.value)}
                    placeholder="Novo produto habitual..."
                    className="flex-1 p-3 bg-white border border-slate-200 rounded-xl text-sm shadow-sm"
                  />
                  <button type="submit" className="bg-emerald-600 text-white font-bold px-4 rounded-xl text-lg shadow-md">+</button>
                </form>

                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                  <h3 className="font-bold text-slate-800 text-sm mb-1">Produtos Habituais (A–Z)</h3>
                  <p className="text-[11px] text-slate-400 mb-4">Clica num produto para o enviar para a Lista de Compras.</p>
                  
                  <div className="flex flex-wrap gap-2">
                    {catalogoOrdenado.map((prod, index) => {
                      const naLista = listaCompras.some(i => i.texto === prod);
                      return (
                        <button
                          key={index}
                          onClick={() => enviarParaCompras(prod)}
                          className={`text-xs px-3 py-2 rounded-xl font-medium transition border flex items-center gap-1.5 ${
                            naLista 
                              ? 'bg-emerald-50 text-emerald-700 border-emerald-300' 
                              : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                          }`}
                        >
                          <span>{prod}</span>
                          <span className="text-[10px]">{naLista ? '✓' : '+'}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ABA COMPRAS */}
            {tab === 'compras' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                  <div className="flex justify-between items-center mb-3">
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm">Carrinho de Supermercado</h3>
                      <span className="text-xs text-slate-400">
                        {listaCompras.filter(i => i.comprado).length} / {listaCompras.length} comprados
                      </span>
                    </div>

                    {listaCompras.length > 0 && (
                      <div className="flex gap-1.5">
                        <button 
                          onClick={limparComprados}
                          className="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-2 py-1.5 rounded-lg transition"
                        >
                          Limpar Comprados
                        </button>
                        <button 
                          onClick={limparListaSupermercado}
                          className="text-[10px] bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium px-2 py-1.5 rounded-lg transition"
                        >
                          Limpar Tudo
                        </button>
                      </div>
                    )}
                  </div>

                  {listaCompras.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-8">A lista de compras está vazia!</p>
                  ) : (
                    <ul className="space-y-2">
                      {comprasOrdenadas.map((item) => (
                        <li key={item.id} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
                          <label className="flex items-center gap-3 flex-1 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={item.comprado}
                              onChange={() => toggleItemCompra(item.id)}
                              className="w-5 h-5 accent-emerald-600 rounded"
                            />
                            <span className={`text-sm font-medium ${item.comprado ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                              {item.texto}
                            </span>
                          </label>
                          <button onClick={() => removerItemCompra(item.id)} className="text-xs text-rose-500 font-bold px-2 py-1">
                            ✕
                          </button>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* MODAL PRATOS */}
          {modalAberto && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[80vh] flex flex-col shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-slate-800 text-base">Selecionar Prato</h3>
                  <button onClick={() => setModalAberto(false)} className="text-slate-400 font-bold text-lg px-2">✕</button>
                </div>

                <input
                  type="text"
                  placeholder="Pesquisar prato..."
                  value={pesquisaPrato}
                  onChange={(e) => setPesquisaPrato(e.target.value)}
                  className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm mb-4 focus:outline-none"
                />

                <div className="overflow-y-auto flex-1 space-y-2 pr-1">
                  {pratosOrdenados
                    .filter(p => p.toLowerCase().includes(pesquisaPrato.toLowerCase()))
                    .map((prato, idx) => (
                      <button
                        key={idx}
                        onClick={() => selecionarPratoDoModal(prato)}
                        className="w-full text-left p-3 bg-slate-50 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-100 rounded-xl text-sm font-medium transition flex justify-between items-center"
                      >
                        <span>{prato}</span>
                        <span className="text-xs text-emerald-600 font-semibold">+ Selecionar</span>
                      </button>
                    ))}
                </div>
              </div>
            </div>
          )}

          {/* NAVEGAÇÃO INFERIOR */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 p-2 max-w-md mx-auto flex justify-around z-20 shadow-lg">
            <button
              onClick={() => setTab('ementa')}
              className={`flex flex-col items-center py-1 px-3 rounded-xl text-xs font-semibold transition ${
                tab === 'ementa' ? 'text-emerald-600 bg-emerald-50' : 'text-slate-400'
              }`}
            >
              <span className="text-base mb-0.5">📅</span>
              Ementa
            </button>

            <button
              onClick={() => setTab('pratos')}
              className={`flex flex-col items-center py-1 px-3 rounded-xl text-xs font-semibold transition ${
                tab === 'pratos' ? 'text-emerald-600 bg-emerald-50' : 'text-slate-400'
              }`}
            >
              <span className="text-base mb-0.5">📖</span>
              Pratos
            </button>

            <button
              onClick={() => setTab('catalogo')}
              className={`flex flex-col items-center py-1 px-3 rounded-xl text-xs font-semibold transition ${
                tab === 'catalogo' ? 'text-emerald-600 bg-emerald-50' : 'text-slate-400'
              }`}
            >
              <span className="text-base mb-0.5">罐</span>
              Produtos
            </button>

            <button
              onClick={() => setTab('compras')}
              className={`flex flex-col items-center py-1 px-3 rounded-xl text-xs font-semibold transition ${
                tab === 'compras' ? 'text-emerald-600 bg-emerald-50' : 'text-slate-400'
              }`}
            >
              <span className="text-base mb-0.5">🛒</span>
              Supermercado
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
